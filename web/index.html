<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Vendas x Metas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script>
  (function () {
    try { var t = localStorage.getItem("vm-tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu">
    <div class="logo">
      <span class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg></span>
      <span><b>Vendas x Metas</b><small>Sistema comercial</small></span>
    </div>
    <div style="overflow:auto;display:grid;gap:2px;align-content:start;flex:1">
      <div class="nav-label">Análise</div>
      <nav class="nav">
        <button class="tab" data-tab="geral"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Visão geral</button>
        <button class="tab" data-tab="analise-metas"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>
        <button class="tab" data-tab="analise-vendas"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Vendas</button>
      </nav>
      <div class="nav-label">Lançamentos</div>
      <nav class="nav">
        <button class="tab" data-tab="notas"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Notas de venda<span class="count" id="n-notas">0</span></button>
        <button class="tab" data-tab="metas"><svg class="i" viewBox="0 0 24 24"><path d="M4 21V4"/><path d="M4 4h11l-2 4 2 4H4"/></svg>Metas do mês<span class="count" id="n-metas">0</span></button>
      </nav>
      <div class="nav-label">Cadastros</div>
      <nav class="nav" id="nav-cadastros"></nav>
      <div class="nav-label">Dados</div>
      <nav class="nav">
        <button class="tab" data-tab="importar"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>Importar planilhas</button>
        <button class="tab" data-tab="cargas"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Histórico<span class="count" id="n-cargas">0</span></button>
        <button class="tab" data-tab="validacao"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Validação<span class="count" id="n-valid">–</span></button>
      </nav>
    </div>
    <div class="side-foot">
      <div class="theme" role="group" aria-label="Tema">
        <button data-tema="light" title="Dia"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Dia</button>
        <button data-tema="dark" title="Noite"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Noite</button>
        <button data-tema="system" title="Seguir o sistema"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Auto</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="bar">
      <div class="bar-in">
        <button class="menu-btn" id="menu-btn" aria-label="Abrir menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="page-title"><h1 id="pg-titulo">Visão geral</h1><p id="pg-sub"></p></div>
        <div class="filters" id="filters">
          <div class="field" data-f="periodo"><label for="f-periodo">Período</label><select id="f-periodo"></select></div>
          <div class="field" data-f="equipe"><label for="f-gerente">Gerente</label><select id="f-gerente"></select></div>
          <div class="field" data-f="equipe"><label for="f-supervisor">Supervisor</label><select id="f-supervisor"></select></div>
          <div class="field" data-f="equipe"><label for="f-vendedor">Vendedor</label><select id="f-vendedor"></select></div>
        </div>
      </div>
    </header>
    <main class="wrap" id="conteudo"></main>
  </div>
</div>
<div id="tip" hidden></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
